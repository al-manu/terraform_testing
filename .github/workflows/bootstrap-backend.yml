name: Bootstrap Terraform Backend

on:
   workflow_dispatch
#   push:
#     branches:
#       - main  # Trigger this workflow when changes are pushed to main branch

jobs:
  bootstrap:
    runs-on: ubuntu-latest

    permissions:
      id-token: write  # Required for OIDC role assumption
      contents: read   # Required for checking out the code

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: ${{ secrets.AWS_DEV_ROLE_ARN }}  # Assuming your IAM role for Terraform
          aws-region: ${{ secrets.AWS_REGION }}  # The AWS region where you want to create the S3 bucket

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.9.8  # Version of Terraform you want to use

      - name: Initialize Terraform
        run: |
          terraform init

      - name: Apply Terraform configuration
        run: |
          terraform apply -auto-approve -target=aws_s3_bucket.state_bucket

      - name: Output the state bucket name
        run: |
          terraform output state_bucket_name
