name: Bootstrap AWS Resources (State and Lock S3 Buckets)

on:
  push:
    branches:
      - 'feature/*'  # Trigger on push to any feature branch

jobs:
  create-resources:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for OIDC
      contents: read   # Required for checking out the code
    environment:
      name: ${{ github.ref }}  # You can dynamically set environment based on the branch

    env:
      AWS_ROLE_ARN: ${{ secrets.AWS_DEV_ROLE_ARN }}  # The role ARN for assuming the dev role
      AWS_REGION: ${{ secrets.AWS_REGION }}  # The AWS region from secrets
      ENVIRONMENT: "dev"  # Default to dev, but this can be set dynamically based on the branch or other logic

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up AWS OIDC credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Initialize Terraform with inline backend configuration
        run: |
          # Dynamically set the environment and tfvars file
          ENVIRONMENT="${{ env.ENVIRONMENT }}"  # Default to dev if not set
          TFVARS_FILE="${ENVIRONMENT}.tfvars"   # Use dev.tfvars, prod.tfvars, etc.

          # Debug: output the path of the tfvars file to ensure it's correct
          echo "Using tfvars file: $TFVARS_FILE"

          # Initialize Terraform with backend config
          terraform init -backend-config="bucket=${{ secrets.STATE_BUCKET_NAME }}" \
                         -backend-config="key=terraform.tfstate" \
                         -backend-config="region=${{ secrets.AWS_REGION }}" \
                         -backend-config="dynamodb_table=${{ secrets.LOCK_BUCKET_NAME }}"

      - name: Apply Terraform with the environment-specific tfvars file
        run: |
          ENVIRONMENT="${{ env.ENVIRONMENT }}"
          TFVARS_FILE="${ENVIRONMENT}.tfvars"  # For example: dev.tfvars, prod.tfvars, etc.
          
          echo "Using tfvars file: $TFVARS_FILE"

          # Check if the tfvars file exists, and apply Terraform
          if [ -f "$TFVARS_FILE" ]; then
            terraform apply -auto-approve -var-file="$TFVARS_FILE"
          else
            echo "Error: $TFVARS_FILE not found!"
            exit 1
          fi
          
      - name: Output the created buckets
        run: |
          STATE_BUCKET_NAME=$(terraform output -raw state_bucket_name)
          LOCK_BUCKET_NAME=$(terraform output -raw lock_bucket_name)

          echo "State bucket: $STATE_BUCKET_NAME"
          echo "Lock bucket: $LOCK_BUCKET_NAME"

          # Set the bucket names as GitHub environment variables for future steps
          echo "state_bucket=$STATE_BUCKET_NAME" >> $GITHUB_ENV
          echo "lock_bucket=$LOCK_BUCKET_NAME" >> $GITHUB_ENV
